# lib-utils atom spec (P-013/T-149/T-151) — math atoms (67) + str atoms
# (45), the spec-driven scale pilot. Multi-module lib: `modules:` maps module name -> atoms.
# `sig` = handl signature (~> canonical), `impl` = key into the
# module impl table (`ops/math.rs` `math_impls()`; `str` keys target a
# future `strs_impls()`), `total` replaces the `guarantee: True`
# decl clauses (all math/str ops carry one). `bool` stays handl.
